app-id: com.qq.QQ
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: qq
separate-locales: false

finish-args:
  - --device=all

  - --share=ipc
  - --share=network

  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio

  # Filesystems
  - --filesystem=xdg-download

  # D-Bus Access
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.kde.StatusNotifierWatcher

  # System D-Bus Access
  - --system-talk-name=org.freedesktop.login1

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gtk-doc
  - '*.la'

modules:
  # runtime cups is built against openssl
  # need cups with gnutls for qq to load gnutls func
  - name: cups
    config-opts:
      - --with-components=all
      - --with-dbusdir=/etc/dbus-1
      - --with-systemd
      - --with-tls=gnutls
      - --with-cups-group=lp
      - --with-system-groups=wheel
      - --with-rundir=/run/cups
      - localedir=/usr/share/locale
    no-make-install: true
    post-install:
      - install -Dm755 cups/libcups.so $FLATPAK_DEST/lib/libcups.so.2
    sources:
      - type: git
        url: https://github.com/OpenPrinting/cups.git
        tag: v2.4.19
        commit: 6ba0487abb05afc93d639f37676add8fd65d3756
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: kerberos
    subdir: src
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.1.tar.gz
        sha256: 1a8832b8cad923ebbf1394f67e2efcf41e3a49f460285a66e35adec8fa0053af

  - name: fontconfig
    buildsystem: simple
    build-commands:
      - install -pDm644 "local.conf" -t "/app/etc/fonts/";
      - install -pDm644 "70-noto-cjk.conf" -t "/app/etc/fonts/conf.d/";
      # `||:` return a successful exit status
      - fc-cache -fsv ||:
    sources:
      - type: file
        url: https://gitlab.archlinux.org/archlinux/packaging/packages/noto-fonts-cjk/-/raw/5fd3534bf7a6e26c7506dc8f40dcd89f37d35627/70-noto-cjk.conf
        sha256: 2417ac0e6720fe8da55ee59f16e36cfe96737bc21432460a322bb0f395e3a521
      - type: file
        path: patch/local.conf
  # For Wayland-only compatibility, workarounding clipboard crash issue
  # https://github.com/flathub/org.flatpak.Builder.BaseApp/blob/branch/25.08/xvfb.json
  - xvfb.json

  # https://github.com/flathub/io.neovim.nvim/blob/a10af66097bbfff4a98286d215f183d4909aa1e6/io.neovim.nvim.yaml#L186
  - name: xclip
    sources:
      - type: archive
        url: https://github.com/astrand/xclip/archive/0.13.tar.gz
        sha256: ca5b8804e3c910a66423a882d79bf3c9450b875ac8528791fb60ec9de667f758
    cleanup:
      - /share/man
      - /bin/xclip-*file
    modules:
      - name: libXmu
        config-opts:
          - --disable-static
          - --disable-docs
        sources:
          - type: archive
            url: https://www.x.org/releases/individual/lib/libXmu-1.1.3.tar.bz2
            sha256: 9c343225e7c3dc0904f2122b562278da5fed639b1b5e880d25111561bac5b731
        cleanup:
          - /include
          - /lib/pkgconfig
          - "*.la"

  # https://github.com/flathub/io.neovim.nvim/blob/a10af66097bbfff4a98286d215f183d4909aa1e6/io.neovim.nvim.yaml#L169
  - name: wl-clipboard
    buildsystem: meson
    config-opts:
      - -Dzshcompletiondir=no
      - -Dfishcompletiondir=no
    sources:
      - type: archive
        url: https://github.com/bugaevc/wl-clipboard/archive/v2.2.1.tar.gz
        sha256: 6eb8081207fb5581d1d82c4bcd9587205a31a3d47bea3ebeb7f41aa1143783eb
        x-checker-data:
          type: anitya
          project-id: 49082
          url-template: https://github.com/bugaevc/wl-clipboard/archive/v$version.tar.gz

    cleanup:
      - /share/man

  # https://github.com/cdown/clipnotify
  - name: clipnotify
    buildsystem: simple
    build-commands:
      - gcc -o clipnotify clipnotify.c -O2 -lX11 -lXfixes
      - install -Dm755 clipnotify $FLATPAK_DEST/bin/clipnotify
    sources:
      - type: file
        path: clipnotify.c

  # https://github.com/kfish/xsel
  - name: xsel
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/kfish/xsel/archive/1.2.1.tar.gz
        sha256: 18487761f5ca626a036d65ef2db8ad9923bf61685e06e7533676c56d7d60eb14
    cleanup:
      - /share/man

  - name: qq
    buildsystem: simple
    build-commands:
      - install apply_extra $FLATPAK_DEST/bin
      - install -Dm755 qq.sh $FLATPAK_DEST/bin/qq
      - install -Dm755 clipsync.py $FLATPAK_DEST/bin/clipsync.py
      - install -Dm644 com.qq.QQ.metainfo.xml -t $FLATPAK_DEST/share/metainfo
      - install -Dm644 com.qq.QQ.png -t $FLATPAK_DEST/share/icons/hicolor/512x512/apps
      - install -Dm644 com.qq.QQ.desktop -t $FLATPAK_DEST/share/applications
    sources:
      - type: script
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - declare -a FLAGS
          - |
            if [[ -f "$XDG_CONFIG_HOME/qq-flags.conf" ]]
            then
              echo "Reading user defined flags from $XDG_CONFIG_HOME/qq-flags.conf..."
              readarray -t FLAGS <"$XDG_CONFIG_HOME/qq-flags.conf"
            else
              echo "Adding default flags..."
              FLAGS+=(--enable-wayland-ime --wayland-text-input-version=3)
            fi
          - |
            if [ -z "$(ls -A /tmp/.X11-unix 2>/dev/null)" ]; then
              if [ -n "$WAYLAND_DISPLAY" ]; then
                FLAGS+=(--ozone-platform=wayland)
                echo "Pass \`${FLAGS[*]}\` to main process..."
                echo "X11 socket is not available, using Wayland + Xvfb..."
                exec xvfb-run clipsync.py zypak-wrapper /app/extra/QQ/qq "${FLAGS[@]}" "$@"
              else
                echo "Neither X11 nor Wayland sockets are available."
              fi
            else
              echo "Pass \`${FLAGS[*]}\` to main process..."
              exec zypak-wrapper /app/extra/QQ/qq "${FLAGS[@]}" "$@"
            fi
        dest-filename: qq.sh

      - type: script
        commands:
          - bsdtar --to-stdout -xf qq.deb data.* | bsdtar -xf -
          - mv opt/QQ .
          - rm -rf qq.deb usr opt data.*
        dest-filename: apply_extra

      - type: file
        path: com.qq.QQ.metainfo.xml

      - type: file
        path: com.qq.QQ.png

      - type: file
        path: com.qq.QQ.desktop
      
      - type: file
        path: clipsync.py

      - type: extra-data
        filename: qq.deb
        only-arches: [x86_64]
        url: https://qqdl.gtimg.cn/qqfile/QQNT/9.9.33/release/c97651b2/QQ_3.2.32_260730_amd64_01.deb
        sha256: 81ae2b8542ef5311fc72ecf53c9a523923c834569c7b0da52e0bf4360b9cb5f9
        size: 184998970
        x-checker-data:
          type: json
          url: https://cdn-go.cn/qq-web/im.qq.com_new/latest/rainbow/pcConfig.json
          version-query: .Linux.version
          url-query: .Linux.x64DownloadUrl.deb
          timestamp-query: .Linux.updateDate
          is-main-source: true

      - type: extra-data
        filename: qq.deb
        only-arches: [aarch64]
        url: https://qqdl.gtimg.cn/qqfile/QQNT/9.9.33/release/c97651b2/QQ_3.2.32_260730_arm64_01.deb
        sha256: ecc02e27b0ae55aba721f0671d44a919c26643456674a1857a2d0cde806e0d7e
        size: 204707692
        x-checker-data:
          type: json
          url: https://cdn-go.cn/qq-web/im.qq.com_new/latest/rainbow/pcConfig.json
          version-query: .Linux.version
          url-query: .Linux.armDownloadUrl.deb
          timestamp-query: .Linux.updateDate
